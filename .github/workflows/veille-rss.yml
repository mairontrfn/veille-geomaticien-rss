
name: Actualiser le flux RSS des offres

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication-rss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le flux RSS
        run: python generer_flux.py

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le flux à publier
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le flux RSS
        id: deployment
        uses: actions/deploy-pages@v4
